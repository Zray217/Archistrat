
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archistrat | 建筑方案构思策略师</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --macos-bg: #f5f5f7;
            --macos-card: rgba(255, 255, 255, 0.72);
            --macos-border: rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--macos-bg);
            color: #1d1d1f;
            overflow-x: hidden;
        }
        h1, h2, h3, .serif {
            font-family: 'Noto Serif SC', serif;
        }
        .macos-glass {
            background: var(--macos-card);
            backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid var(--macos-border);
        }
        .macos-shadow {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
        .macos-window {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.14);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }
        
        /* Presentation Board Layout */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
        }
    </style>

</head>

</body>
</html>
